server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cache hashed build assets aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback — let React Router handle deep links.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Standard gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1024;
}

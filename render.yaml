# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys the Vite SPA as a static site with SPA fallback + asset caching.
services:
  - type: web
    name: academic-stream
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # SPA fallback — every unknown route serves index.html so React Router can handle it.
      - type: rewrite
        source: /*
        destination: /index.html
